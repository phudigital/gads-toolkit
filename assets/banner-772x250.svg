<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 772 250" width="772" height="250">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#0F9D58"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="772" height="250" fill="url(#bg)"/>
  
  <g filter="url(#shadow)" transform="translate(60, 45)">
    <!-- Shield Base -->
    <path d="M80 10 L30 30 V65 C30 100 50 125 80 135 C110 125 130 100 130 65 V30 Z" fill="none" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
    <!-- Cursor/Click -->
    <path d="M68 48 L68 95 L78 82 L90 105 L100 98 L88 75 L105 75 Z" fill="#ffffff"/>
  </g>
  
  <text x="250" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" filter="url(#shadow)">GAds Toolkit</text>
  <text x="250" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#ffffff" filter="url(#shadow)">Phần mềm chống click ảo Google Ads</text>
  <text x="250" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="rgba(255,255,255,0.8)" filter="url(#shadow)">Tối ưu chi phí - Tăng hiệu quả chiến dịch</text>
</svg>
